# CivicFix docker-compose
#
# By default this expects MONGODB_URI to point at a MongoDB Atlas cluster
# (recommended for production). To use a local MongoDB container instead,
# uncomment the `mongo` service below and point MONGODB_URI at it
# (mongodb://mongo:27017/civicfix).

version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '5000:5000'
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      CLIENT_URL: http://localhost:5173
    volumes:
      - uploads:/app/src/uploads
    # depends_on:
    #   - mongo

  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - backend

  # mongo:
  #   image: mongo:7
  #   ports:
  #     - '27017:27017'
  #   volumes:
  #     - mongo-data:/data/db

volumes:
  uploads:
  # mongo-data:
